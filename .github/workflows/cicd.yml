name: cicd

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish -c Release
          -p:Version=${{ github.ref_name }}
          -p:AssemblyVersion=${{ github.ref_name }}
          -p:FileVersion=${{ github.ref_name }}
          -p:InformationalVersion=${{ github.ref_name }}

      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null

          Copy-Item `
            "VYRA.WPF/bin/Release/net8.0-windows/win-x64/publish/VYRA.WPF.exe" `
            "artifacts/VYRA-${{ github.ref_name }}.exe"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VYRA-${{ github.ref_name }}.exe

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      - name: Upload to itch.io
        run: >
          butler push
          artifacts/VYRA-${{ github.ref_name }}.exe
          tupinumboor/vyra:windows
          --userversion ${{ github.ref_name }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
